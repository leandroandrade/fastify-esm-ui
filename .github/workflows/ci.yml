name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'requests/**'
      - '*.md'

# Least privilege by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[OPTIC-RELEASE-AUTOMATION]')"
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build assets
        run: npm run build
      # .npmrc turns install scripts off, so the browsers come from an explicit step.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run tests
        run: npm run test:ci

  automerge:
    name: Merge dependabot's PRs
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
